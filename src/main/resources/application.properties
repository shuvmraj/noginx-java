# Spring Boot Application Properties
# NoGinx – Real-Time NGINX Anomaly Detection System

# Server port - matches original uvicorn default port
server.port=8000

# Application name
spring.application.name=noginx

# =====================================================
# EMAIL CONFIGURATION (Jakarta Mail / SMTP)
# Credentials are loaded from environment variables
# or .env file. Never hardcode credentials here.
# =====================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${NOGINX_MAIL_ID:}
spring.mail.password=${NOGINX_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# =====================================================
# NOGINX CONFIGURATION
# =====================================================
# URL of the prediction endpoint (used by watcher)
noginx.predict-one-url=${PREDICT_ONE_URL:http://127.0.0.1:8000/predict_one}

# Email addresses for alerts
noginx.mail-id=${NOGINX_MAIL_ID:}
noginx.mail-password=${NOGINX_MAIL_PASSWORD:}
noginx.receiver-mail-id=${RECEIVER_MAIL_ID:}

# NGINX log file path to watch
noginx.log-file=/var/log/nginx/access.log
noginx.watcher.log-path=${NGINX_ACCESS_LOG:${noginx.log-file:/var/log/nginx/access.log}}

# Path to the trained model file
noginx.model-path=${user.dir}/data/model.ser
noginx.model-json-path=${user.dir}/data/model.json

# Path to encoder mappings JSON
noginx.encoder-mappings-path=classpath:encoder_mappings.json

# Watcher polling interval in milliseconds (1000ms = 1s, matches Python sleep(1))
noginx.watcher.poll-interval-ms=1000

# Whether to start the watcher automatically on application startup
noginx.watcher.enabled=true
noginx.watcher.auto-start=${noginx.watcher.enabled:true}

# Alert handling
noginx.notifications.enabled=true
noginx.email.enabled=true

# =====================================================
# LOGGING
# =====================================================
logging.level.com.noginx=INFO
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =====================================================
# JACKSON JSON
# =====================================================
spring.jackson.serialization.indent-output=false
